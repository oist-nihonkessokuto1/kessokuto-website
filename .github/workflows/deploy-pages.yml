name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute Vite base path
        id: base
        shell: bash
        run: |
          name="${{ github.event.repository.name }}"
          if [[ "$name" == *.github.io ]]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/$name/" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml

      - name: Install and build
        working-directory: src
        env:
          BASE_PATH: ${{ steps.base.outputs.base }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # base が /repo/ のとき Vite は dist/repo/ 以下に HTML を置くが、
      # GitHub Pages の公開ルートはリポジトリ URL に対応するフラットな dist である必要がある
      - name: Flatten dist for project Pages
        if: steps.base.outputs.base != '/'
        working-directory: src
        env:
          BASE_PATH: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail
          name="${BASE_PATH#/}"
          name="${name%/}"
          mkdir -p dist-pages
          cp -r dist/assets dist-pages/
          cp -r "dist/${name}"/* dist-pages/
          if [[ -d dist/404 ]]; then
            cp -r dist/404 dist-pages/
          fi
          rm -rf dist
          mv dist-pages dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
